name: openrun-waiting
services:
  waiting:
    build:
      context: .
      target: waiting
    image: openrun-waiting:local
    restart: unless-stopped
    user: "${OPENRUN_UID:-1000}:${OPENRUN_GID:-1000}"
    ports:
      - "127.0.0.1:${OPENRUN_PORT:-4340}:4340"
    environment:
      OPENRUN_PUBLIC_URL: ${OPENRUN_PUBLIC_URL:-http://localhost:4340}
      DATABASE_URL: ${DATABASE_URL:-}
      OPENRUN_API_URL: http://127.0.0.1:4340
      OPENRUN_SECRETS_FILE: /run/secrets/catchtable.enc.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/google/credentials.json
    volumes:
      - type: bind
        source: ./secrets/catchtable.enc.json
        target: /run/secrets/catchtable.enc.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENRUN_GOOGLE_CREDENTIALS_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}
        target: /run/google/credentials.json
        read_only: true
        bind:
          create_host_path: false
    shm_size: 1gb
    stop_grace_period: 75s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4340/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
