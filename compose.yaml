services:
  openrun:
    build: .
    image: openrun-remote:local
    # Chrome's persistent profile lock includes the hostname. Keep it stable
    # across container recreation so Chrome can recognize a stopped process.
    hostname: openrun
    restart: unless-stopped
    user: "${OPENRUN_UID:-1000}:${OPENRUN_GID:-1000}"
    ports:
      - "127.0.0.1:4340:4340"
    environment:
      OPENRUN_PUBLIC_URL: ${OPENRUN_PUBLIC_URL:-http://localhost:4340}
      OPENRUN_SECRETS_FILE: /run/secrets/catchtable.enc.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/google/credentials.json
      CATCHTABLE_AUTH_PROVIDER: naver
    volumes:
      - openrun-data:/data
      - ./secrets/catchtable.enc.json:/run/secrets/catchtable.enc.json:ro
      - ${OPENRUN_GOOGLE_CREDENTIALS_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/run/google/credentials.json:ro
    shm_size: 1gb
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4340/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  openrun-data:
