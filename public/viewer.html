<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>로그인 확인 · OpenRun</title><link rel="stylesheet" href="/assets/style.css"><script type="module" src="/assets/viewer.js"></script></head>
<body><header><a class="brand" href="/">OPENRUN</a><span class="badge" id="status" role="status" aria-live="polite">접속 확인</span></header>
<main><section class="intro"><p class="eyebrow">로그인 확인</p><h1 id="title">서버 브라우저에 연결합니다.</h1><p id="description">열린 화면에서 네이버 로그인과 보안 확인을 완료해 주세요. 로그인 상태는 서버에 보관됩니다.</p><button id="connect" class="primary">로그인 화면 열기</button></section>
<section id="desktop-section" hidden aria-label="서버 로그인 브라우저"><div class="toolbar"><span id="remaining"></span><div><button id="keyboard-toggle" aria-expanded="false">키보드</button><button id="tab">Tab</button><button id="backspace">지우기</button><button id="enter">Enter</button><button id="scale-toggle">화면 확대</button><button id="fullscreen">전체 화면</button><button id="reconnect">화면 재연결</button></div></div><div id="screen" aria-label="원격 브라우저 화면"></div><div id="keyboard-panel" hidden><label for="mobile-input">문자 입력</label><textarea id="mobile-input" autocomplete="off" autocapitalize="off" spellcheck="false" rows="1" placeholder="여기에 입력하면 서버 브라우저로 전달됩니다."></textarea></div><p class="caption">이 화면은 서버에서 실행 중인 브라우저입니다. 보안 문자는 직접 입력해 주세요.</p></section>
<section id="booking-completion" hidden><p id="booking-summary" class="note"></p><label><input id="booking-confirmed" type="checkbox"> 캐치테이블의 예약 내역에서 확정 여부를 확인했습니다.</label><p><button id="booking-finish" class="primary" disabled>예약 내역 확인 완료 · 화면 닫기</button></p><p class="caption">이 버튼은 원격 접속을 종료합니다. 예약의 실제 확정·취소 상태는 캐치테이블 내역을 기준으로 합니다.</p></section>
</main></body></html>
